[project]
name = "mcp-redmine"
version = "2026.10.31"
description = "Domain MCP server for Redmine task requirements and completion recheck"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx==0.28.1",
    "mcp[cli]==2.3.0",
    "pydantic>=2.0",
    "pyyaml==6.0.2",
]
authors = [
  { name="Rune Kaagaard" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license-files = ["LICENSE"]
packages = [
    {include = "mcp_redmine"}
]

[project.scripts]
mcp-redmine = "mcp_redmine.server:main"

[project.urls]
Homepage = "https://github.com/runekaagaard/mcp-redmine"
Issues = "https://github.com/runekaagaard/mcp-redmine/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "build==1.2.2.post1",
    "hatchling==1.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
